<title>IFF Bond Renewal Notice Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// Fallback CDNs in case the primary one is blocked or unreachable
(function ensureJsPdf() {
  const fallbacks = [
    "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js",
    "https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"
  ];
  let i = 0;
  function tryNext() {
    if (window.jspdf || i >= fallbacks.length) return;
    const s = document.createElement("script");
    s.src = fallbacks[i++];
    s.onload = function () {
      const st = document.getElementById("libStatus");
      if (st && window.jspdf) st.style.display = "none";
    };
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  window.addEventListener("load", function () {
    if (!window.jspdf) {
      const st = document.getElementById("libStatus");
      if (st) st.style.display = "block";
      tryNext();
    }
  });
})();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #eef2f6;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0,0,0,.10);
    max-width: 560px;
    width: 100%;
    padding: 32px 36px 36px;
  }
  .logo { display: block; max-width: 260px; margin-bottom: 6px; }
  h1 { font-size: 20px; color: #1f3a54; margin: 10px 0 4px; }
  .sub { color: #667; font-size: 13px; margin-bottom: 22px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #2c3e50; margin: 14px 0 4px; }
  input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid #c6cfd8;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: #3d6d9e; box-shadow: 0 0 0 2px rgba(61,109,158,.18); }
  .row { display: flex; gap: 14px; }
  .row > div { flex: 1; }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    background: #1f3a54;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #2c5075; }
  .err { color: #b00020; font-size: 13px; margin-top: 10px; display: none; }
  .hint { font-size: 12px; color: #889; margin-top: 3px; }
</style>

document.getElementById('fDate').valueAsDate = new Date();

function fmtLong(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const months = ["January","February","March","April","May","June","July",
                  "August","September","October","November","December"];
  return months[m - 1] + " " + d + ", " + y;
}

// Draws a paragraph of mixed normal/bold/underline segments with word wrap.
function richPara(doc, segments, x, y, maxWidth, lineH, fontSize) {
  let cx = x, cy = y;
  const spaceW = () => { doc.setFont("helvetica", "normal"); return doc.getTextWidth(" "); };
  segments.forEach(seg => {
    const words = seg.text.split(/\s+/).filter(w => w.length);
    words.forEach((word, i) => {
      const style = seg.bold && seg.italic ? "bolditalic" : seg.bold ? "bold" : seg.italic ? "italic" : "normal";
      doc.setFont("helvetica", style);
      doc.setFontSize(fontSize);
      const w = doc.getTextWidth(word);
      if (cx + w > x + maxWidth) { cx = x; cy += lineH; }
      doc.text(word, cx, cy);
      if (seg.underline) doc.line(cx, cy + 1.5, cx + w, cy + 1.5);
      cx += w + spaceW();
    });
  });
  return cy + lineH;
}

document.getElementById('btnGen').addEventListener('click', () => {
  const err = document.getElementById('errMsg');
  err.style.display = 'none';

  const dateVal = document.getElementById('fDate').value;
  const renewVal = document.getElementById('fRenewal').value;
  const toVal = document.getElementById('fTo').value.trim();
  const bondVal = document.getElementById('fBond').value.trim();
  const impVal = document.getElementById('fImporter').value.trim();
  const irsVal = document.getElementById('fIRS').value.trim();

  const missing = [];
  if (!dateVal) missing.push("Date");
  if (!renewVal) missing.push("Renewal Date");
  if (!toVal) missing.push("To");
  if (!bondVal) missing.push("Customs Bond Number");
  if (!impVal) missing.push("Importer Name on Bond");
  if (!irsVal) missing.push("Importer IRS No.");
  if (missing.length) {
    err.textContent = "Please fill in: " + missing.join(", ");
    err.style.display = 'block';
    return;
  }

  if (!window.jspdf) {
    err.textContent = "The PDF library hasn't loaded. Check your internet connection, then refresh the page and try again.";
    err.style.display = 'block';
    return;
  }

  try {

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });   // 612 x 792
  const M = 58;                    // left/right margin
  const W = 612 - 2 * M;           // usable width
  const FS = 11;                   // body font size
  const LH = 16;                   // line height

  // ---- Header ----
  doc.addImage(IMG1, "PNG", M, 34, 150, 38);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10.5);
  doc.text("CHBL#14289", 612 - M, 46, { align: "right" });

  let y = 108;

  // Date / To
  doc.setFontSize(FS);
  doc.setFont("helvetica", "bold");  doc.text("Date: ", M, y);
  doc.setFont("helvetica", "normal"); doc.text(fmtLong(dateVal), M + doc.getTextWidth("Date:  "), y);
  y += LH + 4;
  doc.setFont("helvetica", "bold");  doc.text("To: ", M, y);
  doc.setFont("helvetica", "normal"); doc.text(toVal, M + doc.getTextWidth("To:  "), y);
  y += LH + 12;

  // Subject
  doc.setFont("helvetica", "bold");
  doc.text("Subject: Renewal Notice - U.S. Customs Continuous Bond (CBP Form 301)", M, y);
  y += LH + 12;

  doc.setFont("helvetica", "normal");
  doc.text("Dear Importer,", M, y);
  y += LH + 8;

  // Body paragraph with renewal date filled in
  y = richPara(doc, [
    { text: "This notice serves as formal communication that your U.S. Customs Continuous Bond is scheduled for renewal on" },
    { text: fmtLong(renewVal), bold: true, underline: true },
    { text: ". Please review the bond details below and indicate your instructions for the upcoming anniversary date." }
  ], M, y, W, LH, FS);
  y += 10;

  // Bond Information
  doc.setFont("helvetica", "bold");
  doc.text("Bond Information", M, y);
  y += LH + 2;

  const bondLines = [
    ["Customs Bond Number: ", bondVal],
    ["Importer Name on Bond: ", impVal],
    ["Importer IRS No.: ", irsVal]
  ];
  bondLines.forEach(([label, val]) => {
    doc.setFont("helvetica", "normal"); doc.text(label, M, y);
    doc.setFont("helvetica", "bold");   doc.text(val, M + doc.getTextWidth(label) + 2, y);
    y += LH;
  });
  y += 10;

  // Options with checkboxes
  doc.setFont("helvetica", "normal");
  doc.text("Please select one option regarding the status of your bond:", M, y);
  y += LH + 4;
  const box = 9;
  doc.setLineWidth(0.9);
  doc.rect(M + 8, y - box + 1.5, box, box);
  doc.text("Renew the bond on the anniversary date", M + 8 + box + 8, y);
  y += LH + 4;
  doc.rect(M + 8, y - box + 1.5, box, box);
  doc.text("Terminate the bond on the anniversary date", M + 8 + box + 8, y);
  y += LH + 12;
  doc.setLineWidth(0.5);

  // Notices
  y = richPara(doc, [
    { text: "Please be advised that IFF requires a minimum of 30 days' written notice to process any bond termination request. Failure to provide timely instructions may result in automatic renewal.", bold: true, italic: true }
  ], M, y, W, LH, FS);
  y += 6;
  y = richPara(doc, [
    { text: "Unless alternative instructions are received, IFF, Inc. will proceed with renewal and issue the corresponding invoice for bond renewal and service fees." }
  ], M, y, W, LH, FS);
  y += 18;

  // Signature block
  doc.text("Authorized Representative: ____________________________    Date: ____________________", M, y);
  y += LH + 14;
  doc.text("Print Name: ______________________________", M, y);
  y += LH + 14;

  richPara(doc, [
    { text: "Please return your completed notice to" },
    { text: "bonds@iffusa.com", bold: true },
    { text: "." }
  ], M, y, W, LH, FS);

  // ---- Footer ----
  doc.addImage(IMG2, "PNG", (612 - 48) / 2, 690, 48, 37);
  doc.addImage(IMG3, "PNG", (612 - 480) / 2, 736, 480, 14);

  // ---- Filename: bond_renewal_{Importer name}{date} ----
  const safeName = impVal.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  doc.save("bond_renewal_" + safeName + "_" + dateVal + ".pdf");

  } catch (e) {
    err.textContent = "Error generating PDF: " + (e && e.message ? e.message : e);
    err.style.display = 'block';
  }
});
</script>
